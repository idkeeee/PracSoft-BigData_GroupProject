<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Messaging</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chat-screen { height: 100vh; }
        #sidebar { border-right: 1px solid #dee2e6; height: 100vh; }
        #messages { height: calc(100vh - 100px); overflow-y: auto; }
        .message { margin: 5px 0; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="login-screen" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="h3 mb-0">Instant Messaging</h1>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <input type="text" id="username-input" class="form-control" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <input type="text" id="server-input" class="form-control" placeholder="Server address" value="localhost:3000">
                        </div>
                        <button id="connect-btn" class="btn btn-primary w-100">Connect</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="container-fluid" style="display: none;">
        <div class="row h-100">
            <div id="sidebar" class="col-md-3 bg-light">
                <div class="p-3">
                    <h2 class="h5">Users Online</h2>
                    <ul id="user-list" class="list-group"></ul>
                </div>
            </div>
            <div class="col-md-9">
                <div id="messages" class="p-3"></div>
                <div class="p-3 border-top">
                    <div class="input-group">
                        <input type="text" id="message-input" class="form-control" placeholder="Type a message">
                        <button id="send-btn" class="btn btn-primary">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
